name: Gen7b layer action test build
on:
  push:
    branches: [test/gen7b-layer-targets]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test engine and UI actions
        run: cargo test --locked -p photocraft-engine -p photocraft-ui-egui actions --lib
      - name: Build test app
        run: cargo build --locked -p photocraft
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-layer-targets-windows
          path: target/debug/photocraft.exe
